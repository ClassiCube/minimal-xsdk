name: publish

on: [push]

jobs:
  publish-docker-image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build the Docker image
      run: |
           docker build . --tag ghcr.io/classicube/minimal-xsdk:latest
           docker run ghcr.io/classicube/minimal-xsdk:latest
           docker push ghcr.io/classicube/minimal-xsdk:latest

